name: Deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for OIDC federated login to Azure. No publish profile / basic auth.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: naimisha-bhajan-roster
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Build
        # `npm run build` runs `prisma generate && next build`.
        # A placeholder DATABASE_URL is enough: Prisma only needs a parseable
        # URL to generate the client, and nothing connects at build time.
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder?sslmode=require
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder?sslmode=require
        run: npm run build

      - name: Prune to production dependencies
        # Keeps the generated Prisma client (node_modules/.prisma) while
        # dropping devDependencies from the deployed artifact.
        run: npm prune --omit=dev

      - name: Package artifact
        run: |
          zip -r deploy.zip . \
            -x '.git/*' '.github/*' 'data/*' '*.env' '.env*' \
            > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: deploy.zip
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy.zip

      - name: Azure logout
        if: always()
        run: az logout || true
