# The v2 branch goes to dev; main goes to production (azure-deploy.yml).
#
# Same build, same runtime, different target — the point of a dev environment
# is that the only difference is which database and which secrets it points at,
# so a thing that works there works here.
name: Deploy to dev

on:
  push:
    branches: [v2]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The schema is generated from the checked-in schema.prisma; no database
      # is contacted at build time.
      - run: npx prisma generate

      - run: npm run lint

      - run: npx vitest run
        env:
          # The offset regression reads the DEV database, which is a copy of
          # production — the canonical table must still reproduce there.
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Assemble the standalone output
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      # Migrate BEFORE the new build goes out, not after.
      #
      # The app and the schema ship together, and the app is the half that
      # breaks first: a build selecting a column that does not exist yet fails
      # every query on the page. Applying first means the window where the two
      # disagree is a database that is ahead of the code, which is the harmless
      # direction — the migrations here are additive.
      #
      # `migrate deploy`, never `migrate dev`: it applies committed migrations
      # and nothing else. It never generates one, never resets, and never
      # touches a database it was not pointed at.
      - name: Apply migrations to the dev database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DEV_DATABASE_URL }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: naimisha-bhajan-roster-dev
          package: .next/standalone
